[package]
name = "palettecraft"
version = "0.5.0"
edition = "2024"
license = "MIT OR Apache-2.0"

[dependencies]
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "webp", "bmp", "tiff"] }
macroquad = "0.4"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"

# Desktop only: settings folder, native file dialogs and the update check (HTTPS). The web
# build (wasm32) keeps its data in the browser and opens / saves / fetches through web/palettecraft.js.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
dirs = "7.0.0"
rfd = "0.18.0"
ureq = "3.5.2"

# Embeds the app icon and version info in the Windows .exe (see build.rs).
[target.'cfg(windows)'.build-dependencies]
winresource = "0.1.34"

[patch.crates-io]
miniquad = { path = "vendor/miniquad" }

[profile.release]
lto = "thin"
strip = true

[profile.dev]
opt-level = 2

[profile.dev.package."*"]
opt-level = 3
